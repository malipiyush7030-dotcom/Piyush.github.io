<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Piyush! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #f4c842;
    --deep: #0a0612;
    --purple: #2d0f5e;
    --rose: #e8527a;
    --cream: #fff8ee;
    --glow: #c084fc;
  }

  body {
    background: var(--deep);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    width: 12px; height: 12px;
    background: var(--gold);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.2s, height 0.2s;
    mix-blend-mode: difference;
  }

  /* Stars background */
  .stars {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 1;   transform: scale(1.2); }
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: drift 10s ease-in-out infinite alternate;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(192,132,252,0.18); top: -100px; left: -100px; }
  .orb-2 { width: 500px; height: 500px; background: rgba(232,82,122,0.12); bottom: -150px; right: -100px; animation-delay: -4s; }
  .orb-3 { width: 300px; height: 300px; background: rgba(244,200,66,0.1); top: 40%; left: 50%; animation-delay: -7s; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.1); }
  }

  /* Main layout */
  .container {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
    gap: 0;
  }

  /* Top tag */
  .tag {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.3s forwards;
    margin-bottom: 20px;
  }

  /* Cake */
  .cake-wrapper {
    position: relative;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
  }
  .cake {
    font-size: 7rem;
    display: block;
    animation: bounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(244,200,66,0.6));
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .halo {
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 20px;
    background: radial-gradient(ellipse, rgba(244,200,66,0.5), transparent 70%);
    border-radius: 50%;
    animation: pulse-halo 2.5s ease-in-out infinite;
  }
  @keyframes pulse-halo {
    0%,100% { opacity: 0.6; transform: translateX(-50%) scaleX(1); }
    50% { opacity: 1; transform: translateX(-50%) scaleX(1.2); }
  }

  /* Name headline */
  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 16vw, 9rem);
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    background: linear-gradient(135deg, var(--gold) 0%, #fde68a 40%, var(--rose) 70%, var(--glow) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards, shimmer 4s linear 2s infinite;
    background-size: 200% auto;
    letter-spacing: -2px;
  }
  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* Subtitle */
  .subtitle {
    font-size: clamp(1rem, 3vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,248,238,0.6);
    margin-top: 10px;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
  }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 30px 0;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s forwards;
    width: min(500px, 90vw);
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(244,200,66,0.5), transparent);
  }
  .divider-gem { color: var(--gold); font-size: 1rem; }

  /* Message card */
  .message-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(244,200,66,0.15);
    border-radius: 2px;
    padding: 36px 40px;
    width: min(600px, 90vw);
    text-align: center;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 1s ease 1.3s forwards;
    backdrop-filter: blur(10px);
  }
  .message-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(192,132,252,0.05), rgba(232,82,122,0.05));
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

  .message-text {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    line-height: 1.9;
    font-weight: 300;
    color: rgba(255,248,238,0.85);
  }
  .message-text em {
    font-style: italic;
    color: var(--gold);
    font-size: 1.1em;
  }

  /* Balloons row */
  .balloons {
    display: flex; gap: 20px;
    margin-top: 30px;
    opacity: 0;
    animation: fadeUp 1s ease 1.5s forwards;
  }
  .balloon {
    font-size: 2.5rem;
    animation: floatBalloon var(--bd) ease-in-out infinite alternate;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  @keyframes floatBalloon {
    from { transform: translateY(0) rotate(-5deg); }
    to   { transform: translateY(-20px) rotate(5deg); }
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 8px; height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: confettiFall var(--cf-d) ease-in var(--cf-delay) infinite;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }

  /* Signature */
  .signature {
    margin-top: 30px;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,248,238,0.25);
    opacity: 0;
    animation: fadeUp 1s ease 1.7s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Fireworks */
  .firework {
    position: fixed;
    pointer-events: none;
    z-index: 5;
  }
  .spark {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    animation: spark-fly var(--s-d) ease-out forwards;
  }
  @keyframes spark-fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="stars" id="stars"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Confetti -->
<div id="confetti"></div>

<div class="container">
  <div class="tag">✦ A very special day ✦</div>

  <div class="cake-wrapper">
    <span class="cake">🎂</span>
    <div class="halo"></div>
  </div>

  <h1 class="name">Piyush</h1>
  <p class="subtitle">Happy Birthday</p>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-gem">✦</span>
    <div class="divider-line"></div>
  </div>

  <div class="message-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <p class="message-text">
      Wishing you a day as <em>brilliant</em> as your smile,<br>
      as <em>joyful</em> as your laughter,<br>
      and as <em>extraordinary</em> as you are.<br><br>
      May this year bring you endless happiness,<br>
      beautiful adventures, and all your heart desires. 🌟
    </p>
  </div>

  <div class="balloons">
    <span class="balloon" style="--bd:2.1s">🎈</span>
    <span class="balloon" style="--bd:1.7s; animation-delay:-0.5s">🎉</span>
    <span class="balloon" style="--bd:2.4s; animation-delay:-1s">🎊</span>
    <span class="balloon" style="--bd:1.9s; animation-delay:-0.3s">🎈</span>
    <span class="balloon" style="--bd:2.2s; animation-delay:-0.8s">⭐</span>
  </div>

  <p class="signature">Made with ❤️ just for you</p>
</div>

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      animation-delay:-${(Math.random()*5).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // Confetti
  const confettiEl = document.getElementById('confetti');
  const colors = ['#f4c842','#e8527a','#c084fc','#60d8ff','#6eefa8','#ff9f7e'];
  for (let i = 0; i < 55; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --cf-d:${(Math.random()*3+3).toFixed(1)}s;
      --cf-delay:${(Math.random()*5).toFixed(1)}s;
      transform:rotate(${Math.random()*360}deg);
    `;
    confettiEl.appendChild(c);
  }

  // Fireworks
  function launchFirework() {
    const fw = document.createElement('div');
    fw.className = 'firework';
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight * 0.6;
    fw.style.cssText = `left:${x}px; top:${y}px;`;
    const sparkColors = ['#f4c842','#e8527a','#c084fc','#fff','#60d8ff'];
    for (let i = 0; i < 18; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      const angle = (i / 18) * 360;
      const dist = 60 + Math.random() * 60;
      const rad = angle * Math.PI / 180;
      sp.style.cssText = `
        background:${sparkColors[Math.floor(Math.random()*sparkColors.length)]};
        --sx:${Math.cos(rad)*dist}px;
        --sy:${Math.sin(rad)*dist}px;
        --s-d:${(Math.random()*0.4+0.6).toFixed(2)}s;
      `;
      fw.appendChild(sp);
    }
    document.body.appendChild(fw);
    setTimeout(() => fw.remove(), 1200);
  }

  // Launch fireworks periodically
  setTimeout(() => {
    launchFirework();
    setInterval(launchFirework, 1800);
  }, 1800);

  // Click to launch firework at cursor
  document.addEventListener('click', e => {
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.cssText = `left:${e.clientX}px; top:${e.clientY}px;`;
    const sparkColors = ['#f4c842','#e8527a','#c084fc','#fff','#60d8ff'];
    for (let i = 0; i < 24; i++) {
      const sp = document.createElement('div');
      sp.className = 'spark';
      const angle = (i / 24) * 360;
      const dist = 70 + Math.random() * 80;
      const rad = angle * Math.PI / 180;
      sp.style.cssText = `
        background:${sparkColors[Math.floor(Math.random()*sparkColors.length)]};
        --sx:${Math.cos(rad)*dist}px;
        --sy:${Math.sin(rad)*dist}px;
        --s-d:${(Math.random()*0.4+0.7).toFixed(2)}s;
      `;
      fw.appendChild(sp);
    }
    document.body.appendChild(fw);
    setTimeout(() => fw.remove(), 1200);
  });
</script>
</body>
</html>
